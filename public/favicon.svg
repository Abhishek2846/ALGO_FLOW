<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#706bf6"/>
      <stop offset="50%" stop-color="#5a97ec"/>
      <stop offset="100%" stop-color="#4ad2a8"/>
    </linearGradient>
    <mask id="hubMask">
      <!-- White reveals, Black cuts out transparent holes -->
      <rect width="64" height="64" fill="#ffffff"/>
      <!-- Central donut hole -->
      <circle cx="32" cy="32" r="3.2" fill="#000000"/>
      <!-- 5 Satellite donut holes -->
      <circle cx="32" cy="16.5" r="2.3" fill="#000000"/>
      <circle cx="46.74" cy="27.21" r="2.3" fill="#000000"/>
      <circle cx="41.11" cy="44.54" r="2.3" fill="#000000"/>
      <circle cx="22.89" cy="44.54" r="2.3" fill="#000000"/>
      <circle cx="17.26" cy="27.21" r="2.3" fill="#000000"/>
    </mask>
  </defs>

  <!-- Squircle container matching the website logo -->
  <rect width="64" height="64" rx="18" fill="url(#brandGrad)"/>

  <!-- 5-node star network hub with hollow node centers -->
  <g mask="url(#hubMask)">
    <!-- 5 Connecting Spokes -->
    <g stroke="#ffffff" stroke-width="4.2" stroke-linecap="round">
      <line x1="32" y1="32" x2="32" y2="16.5"/>
      <line x1="32" y1="32" x2="46.74" y2="27.21"/>
      <line x1="32" y1="32" x2="41.11" y2="44.54"/>
      <line x1="32" y1="32" x2="22.89" y2="44.54"/>
      <line x1="32" y1="32" x2="17.26" y2="27.21"/>
    </g>

    <!-- Center Outer Hub Circle -->
    <circle cx="32" cy="32" r="6.8" fill="#ffffff"/>

    <!-- 5 Satellite Outer Circles -->
    <circle cx="32" cy="16.5" r="5.2" fill="#ffffff"/>
    <circle cx="46.74" cy="27.21" r="5.2" fill="#ffffff"/>
    <circle cx="41.11" cy="44.54" r="5.2" fill="#ffffff"/>
    <circle cx="22.89" cy="44.54" r="5.2" fill="#ffffff"/>
    <circle cx="17.26" cy="27.21" r="5.2" fill="#ffffff"/>
  </g>
</svg>